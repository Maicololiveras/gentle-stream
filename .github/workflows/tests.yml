name: Tests

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.13 / ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-24.04
            shell: bash
          - platform: macOS
            runner: macos-14
            shell: bash
          - platform: WSL
            runner: windows-latest
            shell: wsl-bash {0}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Check out source without stored credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          clean: false

      - name: Install Ubuntu in Windows Subsystem for Linux
        if: matrix.platform == 'WSL'
        uses: Vampire/setup-wsl@887f39deb6c0976365e546926fe66f41b77d65ff # v6
        with:
          distribution: Ubuntu-24.04
          wsl-version: "2"
          set-as-default: "true"
          use-cache: "false"
          update: "true"
          additional-packages: libportaudio2 python3-venv ca-certificates

      - name: Install Linux PortAudio library
        if: matrix.platform == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libportaudio2

      - name: Install macOS PortAudio library
        if: matrix.platform == 'macOS'
        run: brew install portaudio

      - name: Install native uv
        if: matrix.platform != 'WSL'
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.14"
          enable-cache: false

      - name: Install locked dependencies and run device-free tests
        run: |
          platform='${{ matrix.platform }}'
          scratch="$(mktemp -d /tmp/gs-ci-XXXXXX)"
          export PYTHONDONTWRITEBYTECODE=1
          export UV_PYTHON_PREFERENCE=only-managed
          export XDG_CONFIG_HOME="$scratch/config"
          export XDG_CACHE_HOME="$scratch/cache"
          export XDG_RUNTIME_DIR="$scratch/run"
          export UV_CACHE_DIR="$scratch/uv-cache"
          export UV_PYTHON_INSTALL_DIR="$scratch/python"
          export UV_PROJECT_ENVIRONMENT="$scratch/venv"
          export TMPDIR=/tmp
          export PYTEST_ADDOPTS="-o cache_dir=$scratch/pytest-cache"
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME" "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          if [[ "$platform" == WSL ]]; then
            # wsl-bash starts in the translated checkout path. Move off DrvFS:
            # Unix socket permissions and executable fake scripts need POSIX paths.
            cp -R . "$scratch/repo"
            cd "$scratch/repo"
            test "$(uname -s)" = Linux
            grep -qi microsoft /proc/sys/kernel/osrelease
            . /etc/os-release
            test "$ID:$VERSION_ID" = ubuntu:24.04
            # setup-uv is a host action: on Windows it would install Windows uv.
            # Bootstrap Linux uv from its official wheel, not a shell installer.
            python3 -m venv "$scratch/bootstrap"
            "$scratch/bootstrap/bin/python" -m pip install --only-binary=:all: uv==0.11.14
            export PATH="$scratch/bootstrap/bin:$PATH"
          fi
          test "$(tr -d '\r\n' < .python-version)" = 3.13
          uv --version
          uv python install
          uv sync --locked
          uv run --locked python -c 'import sys, sounddevice; assert sys.version_info[:2] == (3, 13); print(sys.version); print(sys.platform); print(sounddevice.get_portaudio_version())'
          # Exact hardware-sensitive function from upstream #3; see docs/ci.md.
          uv run --locked pytest -k 'not test_genre_renders_cleanly_deterministically_and_fast'
